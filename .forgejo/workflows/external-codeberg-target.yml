name: Prepare fixed public Codeberg target
on:
  workflow_dispatch:
concurrency:
  group: external-source-codeberg
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ github.repository == 'xtrape-project/linux-ops-widget-nodejs' && github.ref == 'refs/heads/main' }}
    runs-on: docker
    timeout-minutes: 5
    container:
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s release -p test_external_codeberg_target.py
      - name: Prepare only the fixed empty public repository
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_SERVER_URL: ${{ github.server_url }}
          CODEBERG_PUBLISH_TOKEN: ${{ secrets.CODEBERG_PUBLISH_TOKEN }}
        run: python3 release/external_codeberg_target.py
